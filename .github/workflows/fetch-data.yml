name: Fetch TWSE data

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - run: node scripts/fetch-etf-dividends.mjs
      - run: node scripts/fetch-etf-holdings.mjs
      - run: node scripts/fetch-stock-tags.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history data/etf-dividends.json data/etf-holdings.json data/stock-tags.json
          git diff --cached --quiet || git commit -m "chore: refresh TWSE data"
          git push
